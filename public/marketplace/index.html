<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{platform}} – Order from restaurants near you</title>
  <meta name="description" content="Order online from restaurants that deliver to you, on {{platform}}.">
  <link rel="stylesheet" href="/styles.css">
  <style>
    :root { --brand: #1f2937; --brand-dark: #111827; --accent: #f59e0b; }
    .hero { margin: 18px 0 8px; }
    .hero h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .find { display: grid; gap: 8px; grid-template-columns: 1fr; }
    @media (min-width: 640px) { .find { grid-template-columns: auto 1fr; align-items: end; } }
    .list { display: grid; gap: 12px; margin-top: 16px; }
    .rest { display: flex; gap: 14px; align-items: center; background: var(--card); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); text-decoration: none; color: inherit; border-left: 6px solid var(--c, var(--brand)); }
    .rest .em { font-size: 2rem; width: 48px; text-align: center; flex: none; }
    .rest h3 { margin: 0 0 2px; font-size: 1.05rem; }
    .rest p { margin: 0; }
    .rest.closed { opacity: 0.6; }
    .rest .go { margin-left: auto; font-weight: 700; color: var(--c, var(--brand)); white-space: nowrap; }
  </style>
</head>
<body>
  <header class="topbar"><div class="logo">{{platform}}</div></header>
  <main class="wrap">
    <section class="hero">
      <h1>Restaurants that deliver to you</h1>
      <p class="muted small">Share your location or pick your area. Each restaurant's own menu, prices and delivery.</p>
    </section>
    <div class="find">
      <button class="btn" type="button" id="gps">📍 Use my location</button>
      <select id="area" aria-label="Your area"><option value="">or choose your area…</option></select>
    </div>
    <p class="error hidden" id="err"></p>
    <div class="list" id="list"></div>
  </main>
  <script src="/marketplace/marketplace.js"></script>
</body>
</html>
